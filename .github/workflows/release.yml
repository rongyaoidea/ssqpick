name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v1.0.0）"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布签名 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 与上传附件必需
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 从 Secrets 还原 release 密钥库
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore/ssqpick-release.jks"
          # 两层校验，缺一不可：
          #   1) 证书可读 —— 只证明 store 密码正确
          #   2) 私钥可解 —— 必须真正解密私钥才算密钥可用
          # 早先用 -list 只做了第 1 层，结果带着错的 key 密码跑完了整个构建才失败。
          keytool -list -alias "${{ secrets.KEY_ALIAS }}" \
            -keystore "$RUNNER_TEMP/keystore/ssqpick-release.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null
          # -certreq 需要访问私钥，key 密码错误会在这里立刻失败
          keytool -certreq -alias "${{ secrets.KEY_ALIAS }}" \
            -keystore "$RUNNER_TEMP/keystore/ssqpick-release.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" | grep -q "BEGIN NEW CERTIFICATE REQUEST"
          echo "密钥库与私钥密码均校验通过"

      - name: 记录签名证书指纹
        id: cert
        run: |
          FP=$(keytool -list -v -alias "${{ secrets.KEY_ALIAS }}" \
            -keystore "$RUNNER_TEMP/keystore/ssqpick-release.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep -m1 'SHA256:' | awk '{print $2}')
          echo "signature=$FP" >> "$GITHUB_OUTPUT"
          echo "证书 SHA-256: $FP"
          # 与仓库记录的上一次发布指纹比对，不一致就中止：
          # 上传覆盖签名的包会让老用户无法覆盖升级
          PREV=$(grep -oE 'SHA-256: [0-9A-F:]+' docs/SIGNING.md 2>/dev/null | head -1 | awk '{print $2}')
          if [ -n "$PREV" ] && [ "$PREV" != "$FP" ]; then
            echo "::error::签名指纹与上次发布不一致（$PREV -> $FP），已中止。"
            echo "::error::换了签名密钥会导致已安装用户无法覆盖升级，必须确认这是有意的。"
            exit 1
          fi
          echo "指纹与历史发布一致"

      - name: 构建签名 Release APK 与 AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore/ssqpick-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace --console=plain

      - name: 校验产物确实已用 release 证书签名
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "待校验 APK: $APK"

          # keytool -printcert -jarfile 只认 JAR v1 签名块，对只用 v2/v3 的 APK
          # 会报 "Not a signed jar file" 或直接输出空。APK 签名只能用 apksigner 读。
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "使用 $APKSIGNER"
          # 注意格式：keytool 输出带冒号的 "68:A9:7A:..."，apksigner 输出不带的
          # "68a97ab2..."。必须去掉冒号并统一大小写后再比对，否则会误判。
          CERT=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}' | tr -d ':' | tr 'a-z' 'A-Z')
          EXPECT=$(echo "${{ steps.cert.outputs.signature }}" | tr -d ':')
          echo "APK 证书:  $CERT"
          echo "预期证书:  $EXPECT"

          if [ "$CERT" != "$EXPECT" ]; then
            echo "::error::APK 签名证书与密钥库不匹配（$CERT != $EXPECT）"
            exit 1
          fi
          echo "签名校验通过：产物确由预期 release 证书签发"

      - name: 上传 Release 附件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
